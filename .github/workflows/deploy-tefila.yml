name: Deploy Tefilá de Hannah

on:
  push:
    branches: [main, claude/local-voucher-alejandra-oik0c7]
    paths:
      - "tefila-hannah/**"
      - ".github/workflows/deploy-tefila.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tefila-hannah
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tefila-hannah/package-lock.json

      - run: npm ci

      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions. Sin ellos no se publica."
            exit 0
          fi
          npx wrangler deploy
